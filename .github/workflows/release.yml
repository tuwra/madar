name: Build the apps

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the files to (for example v1.5.0)
        required: true

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Spotlight indexing keeps the dmg volume busy on GitHub's Mac runners
      - run: sudo mdutil -a -i off || true
      # Apple Silicon only
      - run: npx electron-builder --mac dmg --arm64 --publish never
      - run: gh release upload "$TAG" dist/*.dmg --clobber

  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --x64 --publish never
      # start the built app once and make sure every section opens and saves
      - name: Smoke test
        shell: pwsh
        run: |
          $env:MADAR_SELFTEST = '1'; $env:MADAR_HIDDEN = '1'; $env:MADAR_SELFTEST_OUT = "$env:RUNNER_TEMP\selftest.json"
          $p = Start-Process -FilePath "dist\win-unpacked\Madar.exe" -PassThru
          for ($i = 0; $i -lt 60 -and -not (Test-Path $env:MADAR_SELFTEST_OUT); $i++) { Start-Sleep -Seconds 1 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not (Test-Path $env:MADAR_SELFTEST_OUT)) { throw 'the app did not finish its smoke test' }
          $r = Get-Content $env:MADAR_SELFTEST_OUT -Raw; Write-Output $r
          $j = $r | ConvertFrom-Json
          if (-not ($j.desktop -and $j.saved -and $j.blob -and $j.notes -and $j.ink -and $j.libs.pdf)) { throw 'smoke test failed' }
      # latest.yml and the blockmap are what installed copies read to find and download updates
      - run: gh release upload "$env:TAG" (Get-ChildItem dist\*.exe, dist\latest.yml, dist\*.exe.blockmap).FullName --clobber
        shell: pwsh
