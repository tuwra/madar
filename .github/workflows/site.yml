name: Publish the website

# every change to the app on main goes to the website too
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # the libraries in src/vendor are copied in on install
      - run: npm ci
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deploy
        uses: actions/deploy-pages@v4
